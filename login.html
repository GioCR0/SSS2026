<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Area Riservata - Login</title>
</head>
<body>
    <h2>Area Riservata</h2>
    <!-- Il comando onsubmit simula la dinamicità mostrando un avviso a schermo -->
    <form onsubmit="alert('Login simulato con successo! Benvenuto.'); return false;">
        <label for="username">Nome utente:</label><br>
        <input type="text" id="username" required><br><br>
        
        <label for="password">Password:</label><br>
        <input type="password" id="password" required><br><br>
        
        <input type="submit" value="Accedi al sistema">
    </form>
    
    <br>
    <a href="index.html">Torna alla Home</a>
</body>
</html>
